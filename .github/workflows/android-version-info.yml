name: Get Android Version Info

on:
  workflow_call:
    outputs:
      version_name:
        description: 'The version name of the app'
        value: ${{ jobs.get_version.outputs.version_name }}
      version_code:
        description: 'The version code of the app'
        value: ${{ jobs.get_version.outputs.version_code }}

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.get_version.outputs.name }}
      version_code: ${{ steps.get_version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"

      - name: SetUp properties
        run: |
          echo "keystore.release.file_path=${{ secrets.KEYSTORE_RELEASE_FILE_PATH }}" > local.properties
          echo "keystore.release.store_password=${{ secrets.KEYSTORE_RELEASE_PW }}" >> local.properties
          echo "keystore.release.key_alias=${{ secrets.KEYSTORE_RELEASE_ALIAS }}" >> local.properties
          echo "keystore.release.key_password=${{ secrets.KEYSTORE_RELEASE_KEY_PW }}" >> local.properties
          echo "base_url=\"${{ secrets.BASE_URL }}\"" >> local.properties
          echo "auth_type=\"${{ secrets.AUTH_TYPE }}\"" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Version from Gradle
        id: get_version
        run: |
          VERSION_OUTPUT=$(./gradlew getAppVersion -PtargetModule=app --quiet)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | awk '{print $1}')
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | sed 's/.*(\([0-9]*\)).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

