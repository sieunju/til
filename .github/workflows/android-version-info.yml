name: Get Android Version Info

on:
  workflow_call:
    outputs:
      version_name:
        description: "The version name of the app"
        value: ${{ jobs.get_version.outputs.version_name }}
      version_code:
        description: "The version code of the app"
        value: ${{ jobs.get_version.outputs.version_code }}

jobs:
  get_version:
    runs-on: macos-latest
    outputs:
      version_name: ${{ steps.get_version.outputs.name }}
      version_code: ${{ steps.get_version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: SetUp properties
        run: |
          echo "=== Debug: Environment Variables ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo ""
          echo "=== Debug: Secrets (masked) ==="
          echo "KEYSTORE_RELEASE_FILE_PATH: $([ -z '${{ secrets.KEYSTORE_RELEASE_FILE_PATH }}' ] && echo 'empty' || echo 'set')"
          echo "KEYSTORE_RELEASE_PW: $([ -z '${{ secrets.KEYSTORE_RELEASE_PW }}' ] && echo 'empty' || echo 'set')"
          echo "KEYSTORE_RELEASE_ALIAS: $([ -z '${{ secrets.KEYSTORE_RELEASE_ALIAS }}' ] && echo 'empty' || echo 'set')"
          echo "BASE_URL: $([ -z '${{ secrets.BASE_URL }}' ] && echo 'empty' || echo 'set')"
          echo "AUTH_TYPE: $([ -z '${{ secrets.AUTH_TYPE }}' ] && echo 'empty' || echo 'set')"
          echo ""

      - name: Get Version from Gradle
        id: get_version
        run: |
          VERSION_OUTPUT=$(./gradlew getAppVersion -PtargetModule=app --quiet)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | awk '{print $1}')
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | sed 's/.*(\([0-9]*\)).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
