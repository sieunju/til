name: Get Android Version Info

on:
  workflow_call:
    outputs:
      version_name:
        description: "The version name of the app"
        value: ${{ jobs.get_version.outputs.version_name }}
      version_code:
        description: "The version code of the app"
        value: ${{ jobs.get_version.outputs.version_code }}

jobs:
  get_version:
    runs-on: macos-latest
    outputs:
      version_name: ${{ steps.get_version.outputs.name }}
      version_code: ${{ steps.get_version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"

      - name: SetUp properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "keystore.release.file_path=${{ secrets.KEYSTORE_RELEASE_FILE_PATH }}" > local.properties
          echo "keystore.release.store_password=${{ secrets.KEYSTORE_RELEASE_PW }}" >> local.properties
          echo "keystore.release.key_alias=${{ secrets.KEYSTORE_RELEASE_ALIAS }}" >> local.properties
          echo "keystore.release.key_password=${{ secrets.KEYSTORE_RELEASE_KEY_PW }}" >> local.properties
          echo "base_url=\"${{ secrets.BASE_URL }}\"" >> local.properties
          echo "auth_type=\"${{ secrets.AUTH_TYPE }}\"" >> local.properties

      - name: Debug Keystore Path
        run: |
          echo "=== Keystore Debug Info ==="
          echo "GitHub Secret KEYSTORE_RELEASE_FILE_PATH: '${{ secrets.KEYSTORE_RELEASE_FILE_PATH }}'"
          echo ""
          echo "=== Local Properties Content ==="
          cat local.properties | grep keystore || echo "No keystore entries found"
          echo ""
          echo "=== Keystore File Check ==="
          KEYSTORE_PATH=$(grep "keystore.release.file_path" local.properties | cut -d'=' -f2 || echo "")
          echo "Keystore path from local.properties: '$KEYSTORE_PATH'"
          if [ -z "$KEYSTORE_PATH" ]; then
            echo "⚠️  WARNING: Keystore path is empty!"
          else
            echo "Checking if keystore file exists..."
            if [ -f "$KEYSTORE_PATH" ]; then
              echo "✅ Keystore file exists at: $KEYSTORE_PATH"
            else
              echo "❌ Keystore file NOT found at: $KEYSTORE_PATH"
              echo "Checking default location: keystore/til.jks"
              if [ -f "keystore/til.jks" ]; then
                echo "✅ Found keystore at default location: keystore/til.jks"
              else
                echo "❌ Keystore not found at default location either"
              fi
            fi
          fi
          echo ""
          echo "=== Current Directory Structure ==="
          ls -la keystore/ 2>/dev/null || echo "keystore directory not found"

      - name: Get Version from Gradle
        id: get_version
        run: |
          VERSION_OUTPUT=$(./gradlew getAppVersion -PtargetModule=app --quiet)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | awk '{print $1}')
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | sed 's/.*(\([0-9]*\)).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
