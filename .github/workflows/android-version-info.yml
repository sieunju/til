name: Get Android Version Info

on:
  workflow_call:
    outputs:
      version_name:
        description: "The version name of the app"
        value: ${{ jobs.get_version.outputs.version_name }}
      version_code:
        description: "The version code of the app"
        value: ${{ jobs.get_version.outputs.version_code }}

jobs:
  get_version:
    runs-on: macos-latest
    outputs:
      version_name: ${{ steps.get_version.outputs.name }}
      version_code: ${{ steps.get_version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: SetUp properties
        run: |
          echo "=== Debug: Environment Variables ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo ""
          echo "=== Debug: Secrets (masked) ==="
          echo "KEYSTORE_RELEASE_FILE_PATH: $([ -z '${{ secrets.KEYSTORE_RELEASE_FILE_PATH }}' ] && echo 'empty' || echo 'set')"
          echo "KEYSTORE_RELEASE_PW: $([ -z '${{ secrets.KEYSTORE_RELEASE_PW }}' ] && echo 'empty' || echo 'set')"
          echo "KEYSTORE_RELEASE_ALIAS: $([ -z '${{ secrets.KEYSTORE_RELEASE_ALIAS }}' ] && echo 'empty' || echo 'set')"
          echo "BASE_URL: $([ -z '${{ secrets.BASE_URL }}' ] && echo 'empty' || echo 'set')"
          echo "AUTH_TYPE: $([ -z '${{ secrets.AUTH_TYPE }}' ] && echo 'empty' || echo 'set')"
          echo ""
          echo "Test ${{ secrets.KEYSTORE_RELEASE_FILE_PATH }} "
          echo "Test ${{ vars.TEST_TOKEN }} "
          echo "keystore.release.file_path=${{ secrets.KEYSTORE_RELEASE_FILE_PATH }}" >> local.properties
          echo "keystore.release.store_password=${{ secrets.KEYSTORE_RELEASE_PW }}" >> local.properties
          echo "keystore.release.key_alias=${{ secrets.KEYSTORE_RELEASE_ALIAS }}" >> local.properties
          echo "keystore.release.key_password=${{ secrets.KEYSTORE_RELEASE_KEY_PW }}" >> local.properties
          echo "base_url=\"${{ secrets.BASE_URL }}\"" >> local.properties
          echo "auth_type=\"${{ secrets.AUTH_TYPE }}\"" >> local.properties

      - name: Print Local Properties
        run: |
          echo "=== Local Properties Content ==="
          if [ -f local.properties ]; then
            echo "sdk.dir=$(grep '^sdk.dir=' local.properties | cut -d'=' -f2 || echo 'not set')"
            echo "keystore.release.file_path=$(grep '^keystore.release.file_path=' local.properties | cut -d'=' -f2 || echo 'not set')"
            echo "keystore.release.key_alias=$(grep '^keystore.release.key_alias=' local.properties | cut -d'=' -f2 || echo 'not set')"
            echo "base_url=$(grep '^base_url=' local.properties | cut -d'=' -f2 || echo 'not set')"
            echo "auth_type=$(grep '^auth_type=' local.properties | cut -d'=' -f2 || echo 'not set')"
            echo ""
            echo "=== Full local.properties file ==="
            cat local.properties
          else
            echo "❌ local.properties file not found!"
          fi

      - name: Get Version from Gradle
        id: get_version
        run: |
          VERSION_OUTPUT=$(./gradlew getAppVersion -PtargetModule=app --quiet)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | awk '{print $1}')
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | sed 's/.*(\([0-9]*\)).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
